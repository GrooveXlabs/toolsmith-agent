[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsmith-agent"
version = "1.0.0"
description = "Autonomous agent that discovers trending tools and builds improved alternatives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GrooveXlabs", email = "beingeonic@gmail.com"}
]
keywords = ["agent", "github", "automation", "developer-tools", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "pygithub>=2.1.1",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
toolsmith = "cli:cli"

[project.urls]
Homepage = "https://github.com/GrooveXlabs/toolsmith-agent"
Repository = "https://github.com/GrooveXlabs/toolsmith-agent"
